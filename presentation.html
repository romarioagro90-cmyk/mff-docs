
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Презентация — М Фулфилмент</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: #101820;
  font-family: Arial, sans-serif;
}

body { padding: 12px; }

#slides {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
}

.slide-frame {
  width: 100%;
  margin-bottom: 12px;
  overflow: hidden;
  background: #101820;
}

.slide {
  display: block;
  width: 100%;
  height: auto;
  background: #101820;
}

.placeholder {
  width: 100%;
  background: #17232e;
}

#status {
  color: #fff;
  text-align: center;
  padding: 24px;
  font-size: 14px;
}

@media (max-width: 640px) {
  body { padding: 0; }
  .slide-frame { margin-bottom: 4px; }
}
</style>
</head>

<body>
<div id="status">Открываем презентацию...</div>
<main id="slides"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const PDF_FILE = encodeURI(
  "М_Фулфилмент_ Презентация_2026.pdf"
);

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const container = document.getElementById("slides");
const status = document.getElementById("status");

const pixelRatio = Math.min(
  window.devicePixelRatio || 1, 2
);

let pdf;
let observer;
let renderQueue = [];
let processing = false;
let firstSlideShown = false;

function nextFrame() {
  return new Promise(resolve =>
    requestAnimationFrame(() =>
      requestAnimationFrame(resolve)
    )
  );
}

async function renderPage(pageNumber, frame) {
  const page = await pdf.getPage(pageNumber);

  const original = page.getViewport({ scale: 1 });
  const width = frame.clientWidth;
  const scale = width / original.width;

  const viewport = page.getViewport({
    scale: scale * pixelRatio
  });

  const canvas = document.createElement("canvas");

  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);

  const context = canvas.getContext("2d", {
    alpha: false
  });

  context.fillStyle = "#101820";
  context.fillRect(
    0, 0, canvas.width, canvas.height
  );

  await page.render({
    canvasContext: context,
    viewport
  }).promise;

  // Убираем возможные светлые пиксели
  // по краям PDF.
  const crop = Math.min(
    Math.ceil(pixelRatio),
    Math.floor((canvas.width - 1) / 2),
    Math.floor((canvas.height - 1) / 2)
  );

  const result = document.createElement("canvas");
  result.className = "slide";

  result.width = canvas.width - crop * 2;
  result.height = canvas.height - crop * 2;

  result.getContext("2d", {
    alpha: false
  }).drawImage(
    canvas,
    crop,
    crop,
    result.width,
    result.height,
    0,
    0,
    result.width,
    result.height
  );

  frame.replaceChildren(result);

  if (!firstSlideShown) {
    firstSlideShown = true;
    status.style.display = "none";
  }
}

function enqueue(pageNumber, frame) {
  if (frame.dataset.state !== "waiting") return;

  frame.dataset.state = "queued";
  renderQueue.push({ pageNumber, frame });

  processQueue();
}

async function processQueue() {
  if (processing) return;

  processing = true;

  while (renderQueue.length) {
    const task = renderQueue.shift();

    try {
      await renderPage(
        task.pageNumber,
        task.frame
      );

      task.frame.dataset.state = "ready";

    } catch (error) {
      task.frame.dataset.state = "error";
      console.error(
        "Ошибка слайда:",
        task.pageNumber,
        error
      );
    }

    // Даём браузеру показать готовый слайд,
    // прежде чем обрабатывать следующий.
    await nextFrame();
  }

  processing = false;
}

async function start() {
  try {
    pdf = await pdfjsLib.getDocument({
      url: PDF_FILE,
      disableAutoFetch: false
    }).promise;

    const firstPage = await pdf.getPage(1);
    const original = firstPage.getViewport({
      scale: 1
    });

    const ratio = original.height / original.width;

    const frames = [];

    for (let i = 1; i <= pdf.numPages; i++) {
      const frame = document.createElement("section");
      frame.className = "slide-frame";
      frame.dataset.state = "waiting";

      const placeholder = document.createElement("div");
      placeholder.className = "placeholder";
      placeholder.style.aspectRatio =
        original.width + " / " + original.height;

      frame.appendChild(placeholder);
      container.appendChild(frame);
      frames.push(frame);
    }

    // Первый слайд имеет высший приоритет.
    enqueue(1, frames[0]);

    // Остальные слайды загружаются по мере
    // приближения к области просмотра.
    observer = new IntersectionObserver(
      entries => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;

          const index = frames.indexOf(entry.target);

          if (index >= 0) {
            enqueue(index + 1, entry.target);
            observer.unobserve(entry.target);
          }
        }
      },
      {
        rootMargin: "800px 0px",
        threshold: 0
      }
    );

    frames.forEach((frame, index) => {
      if (index > 0) observer.observe(frame);
    });

  } catch (error) {
    status.textContent =
      "Не удалось открыть презентацию. " +
      error.message;
  }
}

start();
</script>
</body>
</html>
